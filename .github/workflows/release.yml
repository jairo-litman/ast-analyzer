name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: linux/amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: |
          go build -ldflags='-s -w' -o astanalyzer-linux-amd64 ./cmd/astanalyzer
          sha256sum astanalyzer-linux-amd64 > astanalyzer-linux-amd64.sha256

      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --generate-notes \
            astanalyzer-linux-amd64 \
            astanalyzer-linux-amd64.sha256
